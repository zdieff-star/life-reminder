<style>

<body>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderList(){
  const container = document.getElementById("container");
  const now = new Date();
  document.getElementById("dateInfo").textContent =
    now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日";
  container.innerHTML = "";
  const selected = shuffle(allTips).slice(0,15);
  selected.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className = "item";
    div.innerHTML = "<div>"+(idx+1)+". "+item.text+"</div>"+
                    "<div class='meta'>"+item.meta+"</div>";
    div.onclick = function(){ copyText(item.text); };
    container.appendChild(div);
  });
}

function copyText(text){
  const tip = document.getElementById("copyTip");
  function done(){
    tip.textContent = "✅ 已复制";
    setTimeout(function(){ tip.textContent=""; },1200);
  }
  function fail(){
    tip.textContent = "⚠️ 复制失败，请长按选择";
    setTimeout(function(){ tip.textContent=""; },1500);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ fail(); }
    document.body.removeChild(ta);
  }
}

window.onload = renderList;
</script>
